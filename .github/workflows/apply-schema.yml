name: Apply schema

# The ONLY sanctioned path for a schema change to reach the live database
# (CLAUDE.md rule 1 — `prisma db push` in the build took production down
# twice). Two runs, by design:
#
#   1. Run with no `confirm_diff_sha`. The job prints the exact SQL that
#      would be applied and its sha256, then STOPS. Nothing is written.
#   2. Read the SQL. Run again with `confirm_diff_sha` set to that sha.
#      The job re-computes the diff; if the database or the schema moved
#      in between, the sha differs and the push is refused.
#
# A diff containing DROP / ALTER COLUMN ... TYPE / RENAME is refused unless
# `allow_destructive` is checked as well. Until 2026-09-18 the preview ended
# in `|| true` and the push ran unconditionally in the same job — the
# preview was theatre (data-steward review).

on:
  workflow_dispatch:
    inputs:
      confirm_diff_sha:
        description: 'sha256 of the previewed diff (leave empty to preview only)'
        type: string
        required: false
        default: ''
      allow_destructive:
        description: 'Allow DROP / ALTER TYPE / RENAME (also passes --accept-data-loss)'
        type: boolean
        default: false

concurrency:
  group: apply-schema
  cancel-in-progress: false

jobs:
  push-schema:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install --no-audit --progress=false

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Preview pending changes
        id: preview
        # Exact SQL that would be applied. A failure here is a failure — no
        # `|| true`; an empty diff is a valid result and means "nothing to do".
        run: |
          npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --script > diff.sql
          echo "=== diff.sql (commit ${{ github.sha }}) ==="
          cat diff.sql
          echo "=== end ==="
          SHA=$(sha256sum diff.sql | cut -d' ' -f1)
          echo "diff sha256: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if grep -qiE '^\s*(DROP |ALTER TABLE .* (DROP |ALTER COLUMN .* TYPE )|.*\bRENAME\b)' diff.sql; then
            echo "destructive=true" >> "$GITHUB_OUTPUT"
            echo "::warning::diff contains DROP / ALTER TYPE / RENAME"
          else
            echo "destructive=false" >> "$GITHUB_OUTPUT"
          fi
          if [ ! -s diff.sql ] || ! grep -qvE '^\s*(--.*)?$' diff.sql; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
            echo "Nothing to apply — schema and database already agree."
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - uses: actions/upload-artifact@v4
        with:
          name: schema-diff-${{ github.run_id }}
          path: diff.sql

      - name: Stop here (preview only)
        if: ${{ inputs.confirm_diff_sha == '' }}
        run: |
          echo "Preview only. To apply, re-run with confirm_diff_sha = ${{ steps.preview.outputs.sha }}"

      - name: Refuse — sha does not match the previewed diff
        if: ${{ inputs.confirm_diff_sha != '' && inputs.confirm_diff_sha != steps.preview.outputs.sha }}
        run: |
          echo "::error::confirm_diff_sha (${{ inputs.confirm_diff_sha }}) != current diff sha (${{ steps.preview.outputs.sha }}). The schema or the database changed since the preview. Re-read the diff above and re-run with its sha."
          exit 1

      - name: Refuse — destructive diff without allow_destructive
        if: ${{ inputs.confirm_diff_sha != '' && steps.preview.outputs.destructive == 'true' && !inputs.allow_destructive }}
        run: |
          echo "::error::This diff drops, retypes or renames. Re-run with allow_destructive checked ONLY if you have read every line and mean it."
          exit 1

      - name: Push schema to database
        if: ${{ inputs.confirm_diff_sha != '' && inputs.confirm_diff_sha == steps.preview.outputs.sha && steps.preview.outputs.empty == 'false' }}
        run: npx prisma db push ${{ inputs.allow_destructive && '--accept-data-loss' || '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
